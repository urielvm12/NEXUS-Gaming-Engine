name: NEXUS Gaming Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer código fuente
        run: |
          unzip -q NEXUS-Gaming-Engine*.zip -d src_temp
          if [ -d src_temp/NEXUS-Gaming-Engine* ]; then
            mv src_temp/NEXUS-Gaming-Engine*/* .
          else
            mv src_temp/* .
          fi

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Gaming-Engine-APK
          path: "**/build/outputs/apk/debug/*.apk"
